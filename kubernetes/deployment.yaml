apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes-deployment
  namespace: notes-app
  labels:
    app: notes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notes
  template:
    metadata:
      labels:
        app: notes
    spec:
      # The InitContainer runs once to ensure the DB table exists before the app starts
      initContainers:
      - name: init-db
        image: python:3.11-slim
        env:
        - name: DB_HOST
          valueFrom: {configMapKeyRef: {name: app-config, key: DB_HOST}}
        - name: DB_NAME
          valueFrom: {configMapKeyRef: {name: app-config, key: DB_NAME}}
        - name: DB_USER
          valueFrom: {configMapKeyRef: {name: app-config, key: DB_USER}}
        - name: DB_PASSWORD
          valueFrom: {secretKeyRef: {name: db-secret, key: password}}
        command: 
        - sh
        - -c
        - |
          pip install psycopg2-binary
          python -c "import psycopg2, os; conn = psycopg2.connect(host=os.getenv('DB_HOST'), database=os.getenv('DB_NAME'), user=os.getenv('DB_USER'), password=os.getenv('DB_PASSWORD')); cur = conn.cursor(); cur.execute('CREATE TABLE IF NOT EXISTS notes (id SERIAL PRIMARY KEY, title TEXT NOT NULL, content TEXT NOT NULL, created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP)'); conn.commit(); print('Table initialized');"
      
      containers:
      - name: notes-app
        image: my-notes-app:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
        env:
        - name: DB_HOST
          valueFrom: {configMapKeyRef: {name: app-config, key: DB_HOST}}
        - name: DB_NAME
          valueFrom: {configMapKeyRef: {name: app-config, key: DB_NAME}}
        - name: DB_USER
          valueFrom: {configMapKeyRef: {name: app-config, key: DB_USER}}
        - name: DB_PORT
          valueFrom: {configMapKeyRef: {name: app-config, key: DB_PORT}}
        - name: DB_PASSWORD
          valueFrom: {secretKeyRef: {name: db-secret, key: password}}