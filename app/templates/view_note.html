{% extends "base.html" %}
{% block content %}
<div class="card">
    <div class="card-header">
        <h2>{{ note.title }}</h2>
    </div>
    <div class="card-body">
        <p>{{ note.content }}</p>
        <small class="text-muted">Created: {{ note.created_at }}</small>
    </div>
    <div class="card-footer">
        <a href="{{ url_for('edit_note', id=note.id) }}" class="btn btn-warning">Edit</a>
        <a href="{{ url_for('index') }}" class="btn btn-secondary">Back</a>
    </div>
</div>
{% endblock %}
