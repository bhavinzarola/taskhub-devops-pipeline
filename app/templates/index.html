{% extends "base.html" %}
{% block content %}
<h1>All Notes</h1>
<div class="row">
    {% for note in notes %}
    <div class="col-md-4 mb-3">
        <div class="card h-100">
            <div class="card-body">
                <h5 class="card-title">{{ note.title }}</h5>
               <p class="card-text">{{ note.created_at.strftime('%Y-%m-%d %H:%M') }}</p>
                <a href="{{ url_for('view_note', id=note.id) }}" class="btn btn-sm btn-info">View</a>
                <a href="{{ url_for('edit_note', id=note.id) }}" class="btn btn-sm btn-warning">Edit</a>
                <a href="{{ url_for('delete_note', id=note.id) }}" class="btn btn-sm btn-danger" onclick="return confirm('Delete?')">Delete</a>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
